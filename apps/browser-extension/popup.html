<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIO Browser Capture</title>
    <link rel="stylesheet" href="src/popup/popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p class="eyebrow">AIO Capture</p>
        <h1>Browser Tab</h1>
      </header>
      <section class="status-list">
        <div><span>Version</span><strong id="extension-version">Unknown</strong></div>
        <div><span>Connection</span><strong id="connection-status">Checking</strong></div>
        <div><span>Runtime</span><strong id="runtime-status">Unknown</strong></div>
        <div><span>Mode</span><strong id="capture-mode">BROWSER_TAB</strong></div>
        <div><span>Current Tab</span><strong id="current-tab">Unknown</strong></div>
        <div><span>Current Title</span><strong id="current-title">Unknown</strong></div>
        <div><span>Current URL</span><strong id="current-url">Unknown</strong></div>
      </section>
      <section id="metadata" class="metadata" hidden></section>
      <footer>
        <button id="capture-button" type="button">Capture</button>
        <button id="diagnostics-button" type="button" class="secondary">Diagnostics</button>
        <button id="settings-button" type="button" class="secondary">Settings</button>
      </footer>
      <p id="message" class="message" role="status"></p>
    </main>
    <script type="module" src="dist/src/popup/popup.js"></script>
  </body>
</html>
